<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order placed — Deskwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  .confirm-wrap {
    max-width: 480px;
    margin: 80px auto;
    background: var(--white);
    border-radius: 8px;
    padding: 36px;
    text-align: center;
  }
  .confirm-wrap p { color: #4a4f57; }
  .confirm-state { display: none; }
  .confirm-state.active { display: block; }
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="/" class="wordmark" style="text-decoration:none;">Deskwell</a>
    </div>
  </header>

  <div class="confirm-wrap">
    <div id="loadingState" class="confirm-state active">
      <h2>Confirming your order&hellip;</h2>
      <p>Just a moment.</p>
    </div>

    <div id="successState" class="confirm-state">
      <h2>Order placed</h2>
      <p id="successText"></p>
      <a href="/" class="btn-primary">Back to store</a>
    </div>

    <div id="errorState" class="confirm-state">
      <h2>Something went wrong</h2>
      <p id="errorText">We couldn't confirm this order. If you were charged, contact support with your payment confirmation.</p>
      <a href="/" class="btn-primary">Back to store</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');

    const show = (id) => {
      document.querySelectorAll('.confirm-state').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    };

    if (!sessionId) {
      show('errorState');
    } else {
      fetch(`/api/checkout-session/${sessionId}`)
        .then(res => {
          if (!res.ok) throw new Error('Not confirmed');
          return res.json();
        })
        .then(order => {
          localStorage.removeItem('deskwell_cart');
          document.getElementById('successText').textContent =
            `Order ${order.id} confirmed for $${order.total.toFixed(2)}. A confirmation was sent to ${order.customer.email}.`;
          show('successState');
        })
        .catch(() => show('errorState'));
    }
  </script>
</body>
</html>
